name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli
      
    - name: Install web dependencies
      run: |
        cd app
        npm install
        
    - name: Build web
      run: |
        cd app
        npm run build
        
    - name: Setup Android project
      run: |
        cd nkt-android
        npm install
        rm -rf dist
        cp -r ../app/dist .
        npx cap sync
        
    - name: Build APK
      run: |
        cd nkt-android/android
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nkt-biology-apk
        path: nkt-android/android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: nkt-android/android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: v${{ github.run_number }}
        name: NKT Biology APK v${{ github.run_number }}
        body: |
          Автоматты құрылған Android APK
          
          Орнату:
          1. APK жүктеңіз
          2. Телефонға көшіріңіз
          3. Орнатыңыз (Белгісіз дереккөзден рұқсат беру керек)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
